<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全身動脈アトラス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  .material-symbols-outlined{
    font-family:'Material Symbols Outlined';
    font-weight:normal; font-style:normal;
    font-size:17px; line-height:1; color:#fff;
    -webkit-font-smoothing:antialiased;
  }
</style>
<style>
  :root{
    --line-red:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#ffffff;
    color:#111111;
    font-family:'Noto Sans JP', sans-serif;
    overflow:hidden;
  }
  .app{ position:relative; height:100vh; overflow:hidden; }

  .glass{
    position:relative;
    background:rgba(255,255,255,0.22);
    backdrop-filter:blur(10px) saturate(240%);
    -webkit-backdrop-filter:blur(10px) saturate(240%);
    border:1px solid rgba(255,255,255,0.85);
    box-shadow:
      0 10px 10px rgba(0,0,0,0.01),
      0 2px 8px rgba(0,0,0,0.06),
      inset 0 1px 1px rgba(255,255,255,0.95),
      inset 0 -6px 14px rgba(255,255,255,0.25);
    overflow:hidden;
    isolation:isolate;
  }
  .glass::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0) 55%, rgba(255,255,255,0.35) 100%);
    pointer-events:none;
    z-index:-1;
  }
  .glass::after{
    content:"";
    position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    pointer-events:none;
    z-index:-1;
  }

  header{
    position:absolute;
    top: max(12px, env(safe-area-inset-top));
    left: max(16px, calc(env(safe-area-inset-left) + 16px));
    right: max(16px, calc(env(safe-area-inset-right) + 16px));
    z-index:50;
    display:flex; align-items:center; gap:12px;
    background:none; border:none; box-shadow:none;
  }
  .title-pill{
    padding:9px 22px; border-radius:20px;
    display:flex; align-items:center;
    flex-shrink:0;
  }
  .title-text{ min-width:0; }
  header h1{
    font-size:16px; font-weight:500; margin:0; letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.25;
  }
  .title-sub{
    font-size:10px; color:#666; letter-spacing:.08em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .controls{
    display:flex; align-items:center;
    position:absolute; top:0; right:0; height:100%;
    z-index:2;
  }

  .search-pill{
    border-radius:999px;
    display:flex; align-items:center;
    height:44px; width:44px;
    overflow:hidden;
    transition:width .28s cubic-bezier(.4,0,.2,1);
    flex-shrink:0;
  }
  .search-pill.expanded{ width:230px; }
  .search-toggle{
    width:44px; height:44px; flex-shrink:0;
    border:none; background:transparent; cursor:pointer; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    color:#111; padding:0;
  }
  .search-toggle:hover{ background:rgba(255,255,255,0.4); }

  input[type=text]{
    background:transparent; border:none; color:#111;
    padding:0 16px 0 0; font-size:16px; width:0; opacity:0;
    font-family:'Noto Sans JP',sans-serif; outline:none;
    transition:opacity .2s ease .05s;
  }
  .search-pill.expanded input[type=text]{ width:170px; opacity:1; }
  input[type=text]::placeholder{ color:#666; }

  .search-results{
    position:absolute; top:calc(100% + 8px); right:0; width:230px;
    max-height:340px; overflow-y:auto; border-radius:18px;
    padding:6px; display:none; z-index:60;
  }
  .search-results.open{ display:block; }
  .search-item{
    padding:10px 14px; border-radius:12px; font-size:13px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .search-item:hover{ background:rgba(255,255,255,0.5); }
  .search-item .hl{ color:var(--line-red); font-weight:700; }
  .search-empty{ padding:14px; font-size:12px; color:#777; text-align:center; }

  button.ctrl{
    color:#111;
    cursor:pointer;
    font-family:'Noto Sans JP',sans-serif; border:none;
  }
  button.ctrl:not(.glass){ background:transparent; }
  button.ctrl:hover{ background:rgba(255,255,255,0.4); }

  .toolbar{
    position:absolute;
    bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px));
    left: max(16px, calc(env(safe-area-inset-left) + 16px));
    z-index:50;
    display:flex; align-items:center; gap:10px;
    background:none; border:none; box-shadow:none;
  }
  .toolbar .glass{ border-radius:999px; }

  .round-btn{
    width:44px; height:44px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .round-btn .material-icons{ font-size:20px; }
  .round-btn .material-symbols-outlined{ font-size:20px; color:#111; }

  .zoom-group{ display:flex; align-items:center; gap:2px; border-radius:999px; padding:4px; }
  button.icon-btn{ padding:6px; border:none; background:transparent; border-radius:999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  button.icon-btn .material-icons{ font-size:17px; }
  button.icon-btn:hover{ background:rgba(255,255,255,0.5); }

  .canvas-wrap{
    position:absolute; inset:0; overflow:hidden; cursor:grab; background:#fff;
    touch-action:none;
  }
  .canvas-wrap.grabbing{ cursor:grabbing; }
  .canvas{ position:absolute; top:0; left:0; transform-origin:0 0; }

  svg.links{ position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
  .link-path{ fill:none; stroke:var(--line-red); stroke-linecap:round; }
  .aorta-curve{ fill:none; stroke:var(--line-red); stroke-linecap:round; stroke-linejoin:round; }

  .node{
    position:absolute;
    transform:translate(0,-50%);
    white-space:nowrap;
    display:flex; align-items:center; gap:0;
  }
  .node.dir-left{
    transform:translate(-100%,-50%);
    flex-direction:row-reverse;
  }
  .node-card{
    background:#fff;
    border:1.5px solid #111;
    border-radius:999px;
    padding:4.5px 18px;
    cursor:pointer;
    user-select:none;
  }
  .node-card:hover{ background:#f5f5f5; }
  .node-card.match{ border-color:var(--line-red); color:var(--line-red); }

  .node-jp{ font-size:14px; font-weight:500; }
  .depth-1 .node-card{ padding:5px 20px; border-width:2px; }
  .depth-1 .node-jp{ font-size:15px; font-weight:700; }

  .material-icons{
    font-size:18px; color:#111; line-height:1;
  }
  .round-toggle{
    width:30px; height:30px; flex-shrink:0;
    border-radius:999px; border:1.5px solid #333; background:#333;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
  }
  .round-toggle:hover{ background:#333; }
  .round-toggle .material-icons{ font-size:17px; color:#fff; }

  .modal-overlay{
    position:fixed; inset:0; 
    display:none; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    border-radius:24px;
    padding:30px 28px; max-width:480px; width:100%; position:relative;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; background:none; border:none; cursor:pointer;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    border-radius:999px; color:#111;
  }
  .modal-close:hover{ background:rgba(255,255,255,0.45); }
  .modal-title{ font-size:22px; font-weight:700; }
  .modal-path{ font-size:14px; line-height:2; margin-top:18px; word-break:break-word; }
  .modal-path .sep{ color:var(--line-red); font-weight:700; padding:0 2px; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:#fff; }
  ::-webkit-scrollbar-thumb{ background:#ccc; border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover{ background:#999; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-pill" style="box-shadow:none; padding:0; border-radius:0; background:none;
    backdrop-filter:blur(0px) saturate(100%);
    -webkit-backdrop-filter:blur(0px) saturate(100%); border:none;">
      <div class="title-text">
        <h1>全身動脈アトラス</h1>
        <div class="title-sub">Systemic Arterial Atlas</div>
      </div>
    </div>
    <div class="controls">
      <div class="glass search-pill" id="searchPill">
        <button class="search-toggle" id="searchToggle" type="button"><span class="material-icons">search</span></button>
        <input id="search" type="text" placeholder="動脈名で検索">
      </div>
      <div class="search-results glass" id="searchResults"></div>
    </div>
  </header>
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas" id="canvas">
      <svg class="links" id="links"></svg>
      <div id="nodes"></div>
    </div>
  </div>
  <div class="toolbar">
    <button class="ctrl glass round-btn" id="expandAll" title="全て展開"><span class="material-symbols-outlined">expand_content</span></button>
    <button class="ctrl glass round-btn" id="collapseAll" title="全て閉じる"><span class="material-symbols-outlined">collapse_content</span></button>
    <span class="zoom-group glass">
      <button class="ctrl icon-btn" id="zoomOut"><span class="material-icons">remove</span></button>
      <button class="ctrl icon-btn" id="zoomIn"><span class="material-icons">add</span></button>
    </span>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box glass">
    <button class="modal-close" id="modalClose">
      <span class="material-icons">close</span>
    </button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-path" id="modalPath"></div>
  </div>
</div>

<script>
/* ---------------- データ：全身動脈の分岐ツリー ---------------- */
const TREE = {
  jp:"大動脈", children:[
    { jp:"上行大動脈", children:[
      { jp:"右冠状動脈", children:[
        { jp:"後下行枝" },
        { jp:"洞房結節枝" }
      ]},
      { jp:"左冠状動脈", children:[
        { jp:"前下行枝(LAD)" },
        { jp:"回旋枝(Cx)" }
      ]}
    ]},
    { jp:"大動脈弓", children:[
      { jp:"腕頭動脈", children:[
        { jp:"右総頸動脈", ref:"CCA" },
        { jp:"右鎖骨下動脈", ref:"SUBCLAVIAN" }
      ]},
      { jp:"左総頸動脈", ref:"CCA" },
      { jp:"左鎖骨下動脈", ref:"SUBCLAVIAN" }
    ]},
    { jp:"胸大動脈", children:[
      { jp:"気管支動脈" },
      { jp:"食道動脈" },
      { jp:"後肋間動脈" },
      { jp:"上横隔動脈" }
    ]},
    { jp:"腹大動脈", children:[
      { jp:"下横隔動脈" },
      { jp:"腹腔動脈", children:[
        { jp:"左胃動脈" },
        { jp:"脾動脈", children:[
          { jp:"膵枝" },
          { jp:"左胃大網動脈" },
          { jp:"短胃動脈" }
        ]},
        { jp:"総肝動脈", children:[
          { jp:"固有肝動脈", children:[
            { jp:"右肝動脈" },
            { jp:"左肝動脈" }
          ]},
          { jp:"胃十二指腸動脈", children:[
            { jp:"右胃大網動脈" },
            { jp:"上膵十二指腸動脈" }
          ]},
          { jp:"右胃動脈" }
        ]}
      ]},
      { jp:"上腸間膜動脈", children:[
        { jp:"下膵十二指腸動脈" },
        { jp:"空腸動脈・回腸動脈" },
        { jp:"回結腸動脈" },
        { jp:"右結腸動脈" },
        { jp:"中結腸動脈" }
      ]},
      { jp:"腎動脈", children:[
        { jp:"副腎下動脈" },
        { jp:"区域動脈" }
      ]},
      { jp:"中副腎動脈" },
      { jp:"精巣(卵巣)動脈" },
      { jp:"下腸間膜動脈", children:[
        { jp:"左結腸動脈" },
        { jp:"S状結腸動脈" },
        { jp:"上直腸動脈" }
      ]},
      { jp:"腰動脈" },
      { jp:"正中仙骨動脈" },
      { jp:"総腸骨動脈", children:[
        { jp:"内腸骨動脈", children:[
          { jp:"腸腰動脈" },
          { jp:"外側仙骨動脈" },
          { jp:"上殿動脈" },
          { jp:"下殿動脈" },
          { jp:"臍動脈(索)" },
          { jp:"膀胱下動脈" },
          { jp:"子宮動脈／精管動脈" },
          { jp:"中直腸動脈" },
          { jp:"内陰部動脈", children:[
            { jp:"下直腸動脈" },
            { jp:"陰茎(核)動脈" }
          ]},
          { jp:"閉鎖動脈" }
        ]},
        { jp:"外腸骨動脈", children:[
          { jp:"下腹壁動脈" },
          { jp:"深腸骨回旋動脈" },
          { jp:"大腿動脈", children:[
            { jp:"浅腸骨回旋動脈" },
            { jp:"外陰部動脈" },
            { jp:"大腿深動脈", children:[
              { jp:"内側大腿回旋動脈" },
              { jp:"外側大腿回旋動脈" },
              { jp:"貫通動脈" }
            ]},
            { jp:"下行膝動脈" },
            { jp:"膝窩動脈", children:[
              { jp:"膝関節動脈(上・中・下)" },
              { jp:"前脛骨動脈", children:[
                { jp:"足背動脈", children:[
                  { jp:"足背動脈弓" },
                  { jp:"第1背側中足動脈" }
                ]}
              ]},
              { jp:"後脛骨動脈", children:[
                { jp:"腓骨動脈" },
                { jp:"内側足底動脈" },
                { jp:"外側足底動脈", children:[
                  { jp:"足底動脈弓" }
                ]}
              ]}
            ]}
          ]}
        ]}
      ]}
    ]}
  ]
};

// 総頸動脈（共通の分岐構造）
const CCA = { jp:"総頸動脈", children:[
  { jp:"内頸動脈", children:[
    { jp:"頸動脈洞・頸動脈小体" },
    { jp:"眼動脈", children:[
      { jp:"網膜中心動脈" },
      { jp:"涙腺動脈" },
      { jp:"篩骨動脈(前・後)" },
      { jp:"眼窩上動脈" },
      { jp:"滑車上動脈" }
    ]},
    { jp:"前大脳動脈", children:[
      { jp:"前交通動脈" }
    ]},
    { jp:"中大脳動脈" },
    { jp:"後交通動脈" },
    { jp:"脈絡叢前動脈" }
  ]},
  { jp:"外頸動脈", children:[
    { jp:"上甲状腺動脈" },
    { jp:"上行咽頭動脈" },
    { jp:"舌動脈" },
    { jp:"顔面動脈", children:[
      { jp:"オトガイ下動脈" },
      { jp:"上唇動脈・下唇動脈" },
      { jp:"内眼角動脈" }
    ]},
    { jp:"後頭動脈" },
    { jp:"後耳介動脈" },
    { jp:"浅側頭動脈", children:[
      { jp:"顔面横動脈" },
      { jp:"前頭枝・頭頂枝" }
    ]},
    { jp:"顎動脈(上顎動脈)", children:[
      { jp:"下歯槽動脈" },
      { jp:"中硬膜動脈" },
      { jp:"眼窩下動脈" },
      { jp:"蝶口蓋動脈" },
      { jp:"下行口蓋動脈" }
    ]}
  ]}
]};

// 鎖骨下動脈（共通の分岐構造）
const SUBCLAVIAN = { jp:"鎖骨下動脈", children:[
  { jp:"椎骨動脈", children:[
    { jp:"脳底動脈", children:[
      { jp:"後大脳動脈" },
      { jp:"上小脳動脈" },
      { jp:"前下小脳動脈" },
      { jp:"迷路動脈(内耳動脈)" }
    ]},
    { jp:"後下小脳動脈" },
    { jp:"脊髄前動脈" }
  ]},
  { jp:"内胸動脈", children:[
    { jp:"心膜横隔動脈" },
    { jp:"前肋間動脈" },
    { jp:"上腹壁動脈" },
    { jp:"筋横隔動脈" }
  ]},
  { jp:"甲状頸動脈", children:[
    { jp:"下甲状腺動脈" },
    { jp:"頸横動脈" },
    { jp:"肩甲上動脈" }
  ]},
  { jp:"肋頸動脈", children:[
    { jp:"最上肋間動脈" },
    { jp:"深頸動脈" }
  ]},
  { jp:"肩甲背動脈" },
  { jp:"腋窩動脈", children:[
    { jp:"最上胸動脈" },
    { jp:"胸肩峰動脈" },
    { jp:"外側胸動脈" },
    { jp:"肩甲下動脈", children:[
      { jp:"肩甲回旋動脈" },
      { jp:"胸背動脈" }
    ]},
    { jp:"前上腕回旋動脈" },
    { jp:"後上腕回旋動脈" },
    { jp:"上腕動脈", children:[
      { jp:"深上腕動脈" },
      { jp:"尺側側副動脈(上)" },
      { jp:"尺側側副動脈(下)" },
      { jp:"橈骨動脈", children:[
        { jp:"橈骨反回動脈" },
        { jp:"浅掌動脈弓" },
        { jp:"母指主動脈" },
        { jp:"背側手根網" }
      ]},
      { jp:"尺骨動脈", children:[
        { jp:"尺骨反回動脈" },
        { jp:"総骨間動脈", children:[
          { jp:"前骨間動脈" },
          { jp:"後骨間動脈" }
        ]},
        { jp:"深掌動脈弓" },
        { jp:"総掌側指動脈" }
      ]}
    ]}
  ]}
]};

// ref を実体に展開（共有オブジェクトだとバグるため、必ずディープコピーする）
function deepClone(node){
  const copy = { jp: node.jp };
  if(node.children) copy.children = node.children.map(deepClone);
  return copy;
}
function resolveRefs(node){
  if(node.ref === "CCA"){
    node.children = CCA.children.map(deepClone);
    delete node.ref;
  } else if(node.ref === "SUBCLAVIAN"){
    node.children = SUBCLAVIAN.children.map(deepClone);
    delete node.ref;
  }
  if(node.children){ node.children.forEach(resolveRefs); }
}
resolveRefs(TREE);

/* ---------------- 状態とレイアウト ---------------- */
let uid = 0;
function tagIds(node, depth){
  node._id = "n"+(uid++);
  node._depth = depth;
  node._expanded = depth < 1; // ルートのみ初期展開
  if(node.children) node.children.forEach(c => tagIds(c, depth+1));
}
tagIds(TREE, 0);

const ROW_H = 46;
const COL_W = 230;
const START_X = 30;
const START_Y = 110;
const BOTTOM_PAD = 90;

const nodesEl = document.getElementById('nodes');
const linksEl = document.getElementById('links');
const canvas = document.getElementById('canvas');
const wrap = document.getElementById('canvasWrap');
let zoom = 1;
let panX = 0, panY = 0;
function applyTransform(){
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

function widthForDepth(d){
  return Math.max(5 - d*0.7, 1.2);
}

// 90度で分岐し、角だけ丸めたコネクタパスを作る（左向き分岐にも対応）
function elbowPath(x1, y1, x2, y2, midX, r){
  if(Math.abs(y2-y1) < 0.5){
    return `M${x1},${y1} L${x2},${y2}`;
  }
  const vdir = y2 > y1 ? 1 : -1;
  const hdir = x2 > x1 ? 1 : -1;
  const rr = Math.max(0, Math.min(r, Math.abs(midX-x1), Math.abs(x2-midX), Math.abs(y2-y1)/2));
  return `M${x1},${y1}
    L${midX-hdir*rr},${y1}
    Q${midX},${y1} ${midX},${y1+vdir*rr}
    L${midX},${y2-vdir*rr}
    Q${midX},${y2} ${midX+hdir*rr},${y2}
    L${x2},${y2}`;
}

let leafCounter = 0;

// 4本の基幹（上行大動脈・大動脈弓・胸大動脈・腹大動脈）を、
// 大動脈弓を頂点とした「逆J字」の抽象的なアーチ上に固定する。
// アーチは半径Rの丸みだけで構成される、幾何学的にきれいな形にする。
const ARCH_R = 90;      // アーチの丸みの半径
const ARCH_PEAK_Y = 140; // アーチ頂点のy座標
const TRUNK_X = 420;     // 胸大動脈・腹大動脈が並ぶ縦のライン
const ASCEND_X = TRUNK_X - ARCH_R*2; // 上行大動脈のx座標（半径2つ分左）
const ARCH_PEAK_X = ASCEND_X + ARCH_R; // アーチ頂点＝上行大動脈と胸大動脈の中間

const ANATOMY_ANCHORS = [
  { jp:"上行大動脈", x:ASCEND_X, y:ARCH_PEAK_Y + ARCH_R + 140, dir:-1 }, // 子は左向きに展開
  { jp:"大動脈弓",   x:ARCH_PEAK_X, y:ARCH_PEAK_Y, dir:1 },
  { jp:"胸大動脈",   x:TRUNK_X, y:600, dir:1 },  // 初期値。展開状況に応じてlayout()内で下に押し出す
  { jp:"腹大動脈",   x:TRUNK_X, y:1050, dir:1 }  // 同上
];
const VERTICAL_GAP = 70; // 展開されたサブツリー同士の最低限の縦の余白

function walkRelative(n, depth, leafRef, out){
  let y;
  if(!n._expanded || !n.children || n.children.length===0){
    y = leafRef.count*ROW_H;
    leafRef.count++;
  } else {
    const ys = n.children.map(c => walkRelative(c, depth+1, leafRef, out));
    y = (ys[0]+ys[ys.length-1])/2;
  }
  out.push({ node:n, relDepth:depth, relY:y });
  return y;
}

// サブツリーの相対レイアウトだけを先に計算する（まだどのYに置くかは決めない）
function computeRelative(anchorNode){
  const rel = [];
  const leafRef = { count:0 };
  const anchorRelY = walkRelative(anchorNode, 0, leafRef, rel);
  return { rel, anchorRelY };
}

// 計算済みの相対レイアウトを、指定したアンカーX/Yに配置する。
// 上端・下端の絶対Y座標も返す（次の基幹をどこまで押し下げるべきか判定するため）
function placeBranch(computed, anchorX, anchorY, dir, positioned){
  const shiftY = anchorY - computed.anchorRelY;
  let top = anchorY, bottom = anchorY;
  computed.rel.forEach(p => {
    const y = p.relY + shiftY;
    if(y > bottom) bottom = y;
    if(y < top) top = y;
    positioned.push({ node:p.node, x: anchorX + dir*p.relDepth*COL_W, y, depth: p.relDepth + 1, dir });
  });
  return { top, bottom };
}

function layout(){
  const positioned = [];
  const [upA, archA, thoA, abdA] = ANATOMY_ANCHORS;
  const [upNode, archNode, thoNode, abdNode] = TREE.children;

  const upRel = computeRelative(upNode);
  const archRel = computeRelative(archNode);
  const thoRel = computeRelative(thoNode);
  const abdRel = computeRelative(abdNode);

  // 上行大動脈・大動脈弓はアーチの形を保つため固定位置のまま
  const upExtent = placeBranch(upRel, upA.x, upA.y, upA.dir, positioned);
  const archExtent = placeBranch(archRel, archA.x, archA.y, archA.dir, positioned);

  // 胸大動脈は、上のふたつが展開されて伸びてきても重ならない位置まで押し下げる
  // （胸大動脈自身が上に張り出す分＝anchorRelY も見込んで余白を取る）
  const clearAbove = Math.max(upExtent.bottom, archExtent.bottom) + VERTICAL_GAP;
  const thoY = Math.max(thoA.y, clearAbove + thoRel.anchorRelY);
  const thoExtent = placeBranch(thoRel, thoA.x, thoY, thoA.dir, positioned);

  // 腹大動脈は、胸大動脈が伸びてきても重ならない位置まで押し下げる
  const abdY = Math.max(abdA.y, thoExtent.bottom + VERTICAL_GAP + abdRel.anchorRelY);
  placeBranch(abdRel, abdA.x, abdY, abdA.dir, positioned);

  // 実際に描画で使ったアンカー座標を保存（アーチ曲線の再描画用）
  layout._resolved = [
    { x:upA.x, y:upA.y }, { x:archA.x, y:archA.y }, { x:thoA.x, y:thoY }, { x:abdA.x, y:abdY }
  ];
  return positioned;
}

let highlightedId = null;

function render(){
  const positions = layout();
  const resolved = layout._resolved;
  const map = {};
  positions.forEach(p => map[p.node._id] = p);

  const allX = positions.map(p=>p.x).concat(resolved.map(a=>a.x));
  const allY = positions.map(p=>p.y).concat(resolved.map(a=>a.y));
  const maxX = Math.max(...allX) + COL_W;
  const maxY = Math.max(...allY) + ROW_H + BOTTOM_PAD;
  canvas.style.width = maxX + "px";
  canvas.style.height = maxY + "px";
  applyTransform();
  linksEl.setAttribute('width', maxX);
  linksEl.setAttribute('height', maxY);
  linksEl.style.width = maxX+"px";
  linksEl.style.height = maxY+"px";

  // nodes
  let html = "";
  positions.forEach(p => {
    const n = p.node;
    const hasChildren = n.children && n.children.length>0;
    const isMatch = n._id === highlightedId;
    const icon = hasChildren ? (n._expanded ? 'remove' : 'add') : '';
    const dirClass = p.dir === -1 ? 'dir-left' : '';
    html += `<div class="node depth-${p.depth} ${dirClass}" style="left:${p.x}px; top:${p.y}px;">
      <div class="node-card ${isMatch?'match':''}" data-id="${n._id}">
        <span class="node-jp">${n.jp}</span>
      </div>
      ${hasChildren ? `<button class="round-toggle" data-id="${n._id}"><span class="material-icons">${icon}</span></button>` : ''}
    </div>`;
  });
  nodesEl.innerHTML = html;
  nodesEl.style.position = "relative";

  // 実際に描画されたカード幅を計測してから線を引く（隙間なく接続するため）
  const widthById = {};
  nodesEl.querySelectorAll('.node-card').forEach(el => {
    widthById[el.dataset.id] = el.offsetWidth;
  });
  const BUTTON_OFFSET = 30; // 丸ボタンの幅（カードとは隙間なく密着）
  let linkSvg = "";

  // 解剖学的な大動脈の基幹カーブ（逆J字：上行大動脈→大動脈弓→胸大動脈→腹大動脈）
  const [UP, ARCH, THO, ABD] = resolved;
  const r = ARCH_R;
  const aortaPath = `
    M${UP.x},${UP.y}
    L${ASCEND_X},${ARCH_PEAK_Y + r}
    A${r},${r} 0 0 1 ${TRUNK_X},${ARCH_PEAK_Y + r}
    L${THO.x},${THO.y}
    L${ABD.x},${ABD.y}
  `;
  linkSvg += `<path class="aorta-curve" d="${aortaPath}" stroke-width="11"/>`;

  positions.forEach(p => {
    if(p.node._expanded && p.node.children){
      const cardW = widthById[p.node._id] || 0;
      const x1 = p.dir === -1 ? (p.x - cardW - BUTTON_OFFSET) : (p.x + cardW + BUTTON_OFFSET);
      const y1 = p.y;
      p.node.children.forEach(c => {
        const cp = map[c._id];
        if(!cp) return;
        const x2 = cp.x, y2 = cp.y;
        const midX = (x1+x2)/2;
        const w = widthForDepth(cp.depth);
        const d = elbowPath(x1, y1, x2, y2, midX, 10);
        linkSvg += `<path class="link-path" d="${d}" stroke-width="${w}"/>`;
      });
    }
  });
  linksEl.innerHTML = linkSvg;

  // bind events
  nodesEl.querySelectorAll('.node-card').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const found = findById(TREE, id);
      if(found) openModal(found);
    });
  });
  nodesEl.querySelectorAll('.round-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const found = findById(TREE, id);
      if(found && found.children && found.children.length){
        found._expanded = !found._expanded;
        render();
      }
    });
  });
}

function findById(node, id){
  if(node._id===id) return node;
  if(node.children){
    for(const c of node.children){
      const r = findById(c, id);
      if(r) return r;
    }
  }
  return null;
}

function findPath(node, id, path){
  path.push(node);
  if(node._id===id) return true;
  if(node.children){
    for(const c of node.children){
      if(findPath(c, id, path)) return true;
    }
  }
  path.pop();
  return false;
}

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalPath = document.getElementById('modalPath');

function openModal(node){
  const path = [];
  findPath(TREE, node._id, path);
  modalTitle.textContent = node.jp;
  modalPath.innerHTML = path.map(n => n.jp).join('<span class="sep"> ー </span>');
  modalOverlay.classList.add('open');
}
function closeModal(){
  modalOverlay.classList.remove('open');
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if(e.target === modalOverlay) closeModal();
});

function expandAll(node, v){
  if(node.children && node.children.length){
    node._expanded = v;
    node.children.forEach(c => expandAll(c, v));
  }
}

// 指定した葉ノードだけが見えるように、そこに至る経路上の祖先だけを展開し、
// それ以外はすべて畳む（対象ノード自身は展開しない＝兄弟は見えるが中身は開かない）
function collapseAllFlags(n){
  if(n.children){
    n._expanded = false;
    n.children.forEach(collapseAllFlags);
  }
}
function revealNode(id){
  const target = findById(TREE, id);
  if(!target) return;
  collapseAllFlags(TREE);
  const path = [];
  findPath(TREE, id, path);
  path.forEach(n => {
    if(n !== target && n.children && n.children.length){
      n._expanded = true;
    }
  });
  highlightedId = id;
  render();
  requestAnimationFrame(() => {
    const el = nodesEl.querySelector(`.node-card[data-id="${id}"]`);
    if(el) panToElement(el);
  });
}

document.getElementById('expandAll').addEventListener('click', () => {
  expandAll(TREE, true);
  render();
});
document.getElementById('collapseAll').addEventListener('click', () => {
  expandAll(TREE, false);
  TREE._expanded = true;
  render();
});

const searchInput = document.getElementById('search');
function panToElement(el){
  const wrapRect = wrap.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  panX += (wrapRect.left + wrapRect.width/2) - (elRect.left + elRect.width/2);
  panY += (wrapRect.top + wrapRect.height/2) - (elRect.top + elRect.height/2);
  canvas.style.transition = 'transform .35s ease';
  applyTransform();
  setTimeout(() => { canvas.style.transition = ''; }, 360);
}

// 検索：入力にヒットする動脈をリスト表示し、一致部分を赤字にする
const searchResultsEl = document.getElementById('searchResults');
function collectMatches(term){
  const results = [];
  function walk(n){
    if(n !== TREE && n.jp.includes(term)) results.push(n);
    if(n.children) n.children.forEach(walk);
  }
  walk(TREE);
  return results;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderSearchResults(rawTerm){
  const term = rawTerm.trim();
  if(term.length === 0){
    searchResultsEl.classList.remove('open');
    searchResultsEl.innerHTML = '';
    return;
  }
  const matches = collectMatches(term).slice(0, 40);
  if(matches.length === 0){
    searchResultsEl.innerHTML = `<div class="search-empty">見つかりません</div>`;
    searchResultsEl.classList.add('open');
    return;
  }
  searchResultsEl.innerHTML = matches.map(n => {
    const idx = n.jp.indexOf(term);
    const before = escapeHtml(n.jp.slice(0, idx));
    const hit = escapeHtml(n.jp.slice(idx, idx + term.length));
    const after = escapeHtml(n.jp.slice(idx + term.length));
    return `<div class="search-item" data-id="${n._id}">${before}<span class="hl">${hit}</span>${after}</div>`;
  }).join('');
  searchResultsEl.classList.add('open');
  searchResultsEl.querySelectorAll('.search-item').forEach(el => {
    el.addEventListener('click', () => {
      revealNode(el.dataset.id);
      searchResultsEl.classList.remove('open');
      searchInput.value = '';
      searchPill.classList.remove('expanded');
    });
  });
}
searchInput.addEventListener('input', (e) => {
  renderSearchResults(e.target.value);
});

// 検索：丸いアイコンボタンをタップすると伸びて入力欄が出る
const searchPill = document.getElementById('searchPill');
const searchToggle = document.getElementById('searchToggle');
searchToggle.addEventListener('click', () => {
  if(searchPill.classList.contains('expanded')){
    searchPill.classList.remove('expanded');
    searchInput.value = '';
    renderSearchResults('');
  } else {
    searchPill.classList.add('expanded');
    setTimeout(() => searchInput.focus(), 220);
  }
});
searchInput.addEventListener('blur', () => {
  setTimeout(() => {
    if(searchInput.value.trim().length === 0){
      searchPill.classList.remove('expanded');
      searchResultsEl.classList.remove('open');
    }
  }, 150);
});

function clampZoom(z){ return Math.min(2.5, Math.max(0.3, z)); }

// 指定したスクリーン座標を中心にズームする（Googleマップのような挙動）。
// レイアウトの再計算はせず、transformの更新だけで済ませる（軽量・無制限）
function zoomAt(newZoom, clientX, clientY){
  newZoom = clampZoom(newZoom);
  const rect = wrap.getBoundingClientRect();
  const localX = clientX - rect.left;
  const localY = clientY - rect.top;
  const contentX = (localX - panX) / zoom;
  const contentY = (localY - panY) / zoom;
  zoom = newZoom;
  panX = localX - contentX*zoom;
  panY = localY - contentY*zoom;
  applyTransform();
}

function setZoom(z){
  const rect = wrap.getBoundingClientRect();
  zoomAt(z, rect.left + rect.width/2, rect.top + rect.height/2);
}

document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 0.2));
document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 0.2));

// マウスホイール／トラックパッドで、カーソル位置を中心に拡大縮小
wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomAt(zoom - e.deltaY * 0.012, e.clientX, e.clientY);
}, { passive:false });

// マウスドラッグで上下左右に際限なくパン
let isDown=false, startX, startY, panStartXm, panStartYm;
wrap.addEventListener('mousedown', (e)=>{
  if(e.target.closest('.node-card') || e.target.closest('input') || e.target.closest('button')) return;
  isDown=true; wrap.classList.add('grabbing');
  startX = e.pageX; startY = e.pageY;
  panStartXm = panX; panStartYm = panY;
});
window.addEventListener('mouseup', ()=>{ isDown=false; wrap.classList.remove('grabbing'); });
window.addEventListener('mousemove', (e)=>{
  if(!isDown) return;
  e.preventDefault();
  panX = panStartXm + (e.pageX - startX);
  panY = panStartYm + (e.pageY - startY);
  applyTransform();
});

// タッチ：1本指でパン、2本指でピンチズーム（Googleマップ相当の操作感、上下左右に無制限）
function touchDist(t1, t2){ return Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY); }
function touchMid(t1, t2){ return { x:(t1.clientX+t2.clientX)/2, y:(t1.clientY+t2.clientY)/2 }; }

let touchMode = null; // 'pan' | 'pinch'
let panStartX=0, panStartY=0, panOrigX=0, panOrigY=0;
let pinchStartDist=0, pinchStartZoom=1;

wrap.addEventListener('touchstart', (e) => {
  if(e.target.closest('.node-card') || e.target.closest('input') || e.target.closest('button')) return;
  if(e.touches.length === 1){
    touchMode = 'pan';
    panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
    panOrigX = panX; panOrigY = panY;
  } else if(e.touches.length === 2){
    touchMode = 'pinch';
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartZoom = zoom;
  }
}, { passive:false });

wrap.addEventListener('touchmove', (e) => {
  if(touchMode === 'pan' && e.touches.length === 1){
    e.preventDefault();
    panX = panOrigX + (e.touches[0].clientX - panStartX);
    panY = panOrigY + (e.touches[0].clientY - panStartY);
    applyTransform();
  } else if(touchMode === 'pinch' && e.touches.length === 2){
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    const mid = touchMid(e.touches[0], e.touches[1]);
    const newZoom = pinchStartZoom * (dist / pinchStartDist);
    zoomAt(newZoom, mid.x, mid.y);
  }
}, { passive:false });

wrap.addEventListener('touchend', (e) => {
  if(e.touches.length === 0) touchMode = null;
  else if(e.touches.length === 1){
    touchMode = 'pan';
    panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
    panOrigX = panX; panOrigY = panY;
  }
});

render();

// 初期表示：上行・弓・胸・腹の全体が画面に収まるようズーム・位置を合わせる
function fitToView(){
  const resolved = layout._resolved || ANATOMY_ANCHORS;
  const pad = 260;
  const minX = Math.min(...resolved.map(a=>a.x)) - pad;
  const maxX = Math.max(...resolved.map(a=>a.x)) + pad;
  const minY = Math.min(...resolved.map(a=>a.y)) - pad;
  const maxY = Math.max(...resolved.map(a=>a.y)) + pad;
  const rect = wrap.getBoundingClientRect();
  const scale = clampZoom(Math.min(rect.width/(maxX-minX), rect.height/(maxY-minY)));
  zoom = scale;
  panX = rect.width/2 - (minX+maxX)/2*zoom;
  panY = rect.height/2 - (minY+maxY)/2*zoom;
  applyTransform();
}
fitToView();
</script>
</body>
