        let v = inp.value.trim();
        if (!v.startsWith('#')) v = '#' + v;
        if (/^#[0-9a-fA-F]{6}$/.test(v)) {
          const subjId = inp.dataset.hexSubj;
          SubjectColors.set(subjId, v);
          refreshSubjectColor(subjId, v);
        } else {
          showToast('カラーコードが適切ではありません');
        }
      });
    });

    // Reset subject color
    $$('#settings-body button[data-reset]').forEach(btn => {
      btn.addEventListener('click', () => {
        const subjId = btn.dataset.reset;
        SubjectColors.reset(subjId);
        const subj = findSubject(subjId);
        refreshSubjectColor(subjId, subj.color);
      });
    });

    // Widget eye toggles
    $$('#widget-list .widget-eye').forEach(eye => {
      eye.addEventListener('click', () => {
        const key = eye.dataset.eyeKey;
        Prefs.toggleWidget(key);
        const item = eye.closest('.widget-item');
        const visible = Prefs.isVisible(key);
        item.classList.toggle('hidden-widget', !visible);
        eye.classList.toggle('visible-eye', visible);
        eye.textContent = visible ? 'visibility' : 'visibility_off';
      });
    });

    // Drag and drop reorder
    initWidgetReorder();
  }

  function refreshSubjectColor(subjId, color) {
    const row = $(`#settings-body .color-row[data-subj="${subjId}"]`);
    if (!row) return;
    row.querySelector('.subj-chip').style.background = color;
    row.querySelectorAll('.swatch').forEach(s => {
      s.classList.toggle('selected', s.dataset.swatch.toLowerCase() === color.toLowerCase());
    });
    const colorInp = row.querySelector('input[type="color"]');
    if (colorInp) colorInp.value = color;
    const hexInp = row.querySelector('input.hex-input');
    if (hexInp) hexInp.value = color.toUpperCase();
  }

  function initWidgetReorder() {
    const list = $('#widget-list');
    if (!list) return;

    let draggedItem = null;
    let placeholder = null;
    let startY = 0;
    let touchOffsetY = 0;

    // ---- Pointer-based (works on mobile + desktop) ----
    list.querySelectorAll('.widget-item').forEach(item => {
      const handle = item.querySelector('.widget-handle');
      if (!handle || item.dataset.key === 'hero' || item.dataset.key === 'subjects') return;

      handle.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        startDrag(item, e.clientY);
        handle.setPointerCapture(e.pointerId);

        const onMove = (ev) => onDragMove(ev.clientY);
        const onUp = (ev) => {
          endDrag();
          handle.releasePointerCapture(ev.pointerId);
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onUp);
          handle.removeEventListener('pointercancel', onUp);
        };
        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
        handle.addEventListener('pointercancel', onUp);
      });
    });

    function startDrag(item, clientY) {
      draggedItem = item;
      const rect = item.getBoundingClientRect();
      touchOffsetY = clientY - rect.top;
      placeholder = item.cloneNode(false);
      placeholder.className = 'widget-item placeholder';
      placeholder.style.height = rect.height + 'px';
      item.parentNode.insertBefore(placeholder, item.nextSibling);
      // Make item absolute-positioned
      item.classList.add('dragging');
      item.style.position = 'fixed';
      item.style.width = rect.width + 'px';
      item.style.left = rect.left + 'px';
      item.style.top = (clientY - touchOffsetY) + 'px';
      item.style.zIndex = '1000';
      document.body.style.userSelect = 'none';
    }

    function onDragMove(clientY) {
      if (!draggedItem) return;
      draggedItem.style.top = (clientY - touchOffsetY) + 'px';

      // Find target sibling
      const itemRect = draggedItem.getBoundingClientRect();
      const itemMidY = itemRect.top + itemRect.height / 2;
      const siblings = Array.from(list.children).filter(c => c !== draggedItem && c !== placeholder);
      let inserted = false;
      for (const sib of siblings) {
        const r = sib.getBoundingClientRect();
        if (itemMidY < r.top + r.height / 2) {
          list.insertBefore(placeholder, sib);
          inserted = true;
          break;
        }
      }
      if (!inserted) list.appendChild(placeholder);
    }

    function endDrag() {
      if (!draggedItem) return;
      list.insertBefore(draggedItem, placeholder);
      placeholder.remove();
      draggedItem.classList.remove('dragging');
      draggedItem.style.position = '';
      draggedItem.style.width = '';
      draggedItem.style.left = '';
      draggedItem.style.top = '';
      draggedItem.style.zIndex = '';
      document.body.style.userSelect = '';

      // Persist new order
      const newOrder = Array.from(list.children).map(c => c.dataset.key).filter(Boolean);
      Prefs.set('widgetOrder', newOrder);

      draggedItem = null;
      placeholder = null;
    }
  }

  function exportData() {
    const data = {
      version: 2,
      exportedAt: new Date().toISOString(),
      flags: LS.get(STORAGE.FLAGS, {}),
      records: LS.get(STORAGE.RECORDS, {}),
      grades: LS.get(STORAGE.GRADES, {}),
      prefs: LS.get(STORAGE.PREFS, {}),
      colors: LS.get(STORAGE.COLORS, {})
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `majanca-backup-${jstDate()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('エクスポートしました');
  }

  async function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || typeof data !== 'object') throw 0;
      if (!confirm('既存の学習データを上書きします。よろしいですか？')) return;
      if (data.flags) LS.set(STORAGE.FLAGS, data.flags);
      if (data.records) LS.set(STORAGE.RECORDS, data.records);
      if (data.grades) LS.set(STORAGE.GRADES, data.grades);
      if (data.prefs) LS.set(STORAGE.PREFS, data.prefs);
      if (data.colors) LS.set(STORAGE.COLORS, data.colors);
      Prefs.load();
      Prefs.apply();
      showToast('インポートしました');
      close();
      setTimeout(() => { go('/'); route(); }, 400);
    } catch {
      showToast('ファイルを読み込めませんでした');
    }
    e.target.value = '';
  }

  function resetAll() {
    if (!confirm('すべての学習履歴（演習記録・正誤・フラグ）を削除します。\nこの操作は取り消せません。よろしいですか？')) return;
    localStorage.removeItem(STORAGE.FLAGS);
    localStorage.removeItem(STORAGE.RECORDS);
    localStorage.removeItem(STORAGE.GRADES);
    showToast('学習履歴をリセットしました');
    renderSettings();
    close();
    setTimeout(() => { go('/'); route(); }, 400);
  }
}

/* =====================================================================
   Keyboard shortcuts
===================================================================== */
function initShortcuts() {
  document.addEventListener('keydown', e => {
    const r = parseRoute();
    if (r.name !== 'study') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'n') { e.preventDefault(); nextQuestion(); }
    else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'p') { e.preventDefault(); prevQuestion(); }
    else if (e.key === ' ') { e.preventDefault(); if (maskClickHandler) maskClickHandler({ target: document.body }); }
    else if (e.key.toLowerCase() === 'f') $('#flag-btn')?.click();
    else if (e.key.toLowerCase() === 'e') $('#exp-toggle')?.click();
    else if (['1','2','3','4'].includes(e.key)) $$('#assess-row .assess-btn')[Number(e.key)-1]?.click();
  });
}

function initBrandBack() {
  $('#brand').addEventListener('click', (e) => {
    if (parseRoute().name === 'study' && State.currentSubject) {
      e.preventDefault();
      go(`/subject/${State.currentSubject.id}`);
    }
  });
}

/* =====================================================================
   Custom Subject Modal
===================================================================== */
let csSelectedColor = SUBJECT_SWATCHES[0];
let csJsonData = null;

function csSelectColor(el) {
  document.querySelectorAll('#cs-swatch-row .swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  csSelectedColor = el.dataset.color;
}

function openCustomSubjectModal() {
  csJsonData = null;
  csSelectedColor = SUBJECT_SWATCHES[0];
  document.getElementById('cs-name').value = '';
  document.getElementById('cs-subname').value = '';
  document.getElementById('cs-icon').value = '';
  document.getElementById('cs-file-label').textContent = 'タップしてJSONを選択';
  document.getElementById('cs-save-btn').disabled = true;
  document.querySelectorAll('#cs-swatch-row .swatch').forEach((s, i) => s.classList.toggle('selected', i === 0));

  document.getElementById('custom-subject-backdrop').classList.add('open');
  document.getElementById('custom-subject-panel').classList.add('open');
}

function initCustomSubjectModal() {
  // スウォッチを動的に生成
  const swatchRow = document.getElementById('cs-swatch-row');
  SUBJECT_SWATCHES.forEach((c, i) => {
    const s = el('div', { className: 'swatch' + (i === 0 ? ' selected' : '') });
    s.style.background = c;
    s.dataset.color = c;
    s.addEventListener('click', () => {
      swatchRow.querySelectorAll('.swatch').forEach(x => x.classList.remove('selected'));
      s.classList.add('selected');
      csSelectedColor = c;
    });
    swatchRow.appendChild(s);
  });
  const backdrop = document.getElementById('custom-subject-backdrop');
  const panel = document.getElementById('custom-subject-panel');
  const close = () => {
    backdrop.classList.remove('open');
    panel.classList.remove('open');
  };

  document.getElementById('custom-subject-close').addEventListener('click', close);
  backdrop.addEventListener('click', close);

  // JSONファイル読み込み
  document.getElementById('cs-file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      csJsonData = JSON.parse(text);
      document.getElementById('cs-file-label').textContent = `✓ ${file.name}`;
      updateCsSaveBtn();
    } catch {
      showToast('JSONの読み込みに失敗しました');
    }
    e.target.value = '';
  });

  // 名前入力で保存ボタン更新
  ['cs-name', 'cs-icon'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateCsSaveBtn);
  });

  // 保存
  document.getElementById('cs-save-btn').addEventListener('click', () => {
    const name = document.getElementById('cs-name').value.trim();
    const subname = document.getElementById('cs-subname').value.trim();
    const icon = document.getElementById('cs-icon').value.trim();
    if (!name || !icon || !csJsonData) return;

    const newSubj = {
      id: CustomSubjects.generateId(),
      name, subname, color: csSelectedColor,
      file: null // カスタム科目はfileプロパティ不要
    };

    CustomSubjects.add(newSubj);
    // データをStateに保存
    State.subjectsData[newSubj.id] = csJsonData;
    // iconはsubject-iconに表示するためidの代わりにiconを使う
    newSubj.icon = icon;
    // 上書き保存
    const all = CustomSubjects.load();
    all[all.length - 1].icon = icon;
    CustomSubjects.save(all);

    close();
    showToast(`${name} を追加しました`);
    renderHome();
  });
}

function updateCsSaveBtn() {
  const name = document.getElementById('cs-name').value.trim();
  const icon = document.getElementById('cs-icon').value.trim();
  document.getElementById('cs-save-btn').disabled = !(name && icon && csJsonData);
}

/* =====================================================================
   Boot
===================================================================== */
async function boot() {
  Prefs.load();
  Prefs.apply();
  initTheme();
  State.manifest = await loadManifest();
  initSearch();
  initSettings();
  initShortcuts();
  initBrandBack();   // ← この行を追加
  initCustomSubjectModal();
  window.addEventListener('hashchange', route);
  await route();
}
window.go = go;
boot();
</script>
